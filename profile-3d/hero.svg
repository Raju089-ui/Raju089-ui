<style>
.h1    { font: 700 38px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #1a3a5c; }
.h2    { font: 700 27px 'Segoe UI', Ubuntu, sans-serif; fill: #1a3a5c; }
.sub   { font: 400 16px 'Segoe UI', Ubuntu, sans-serif; fill: #5b7694; }
.sec   { font: 600 13px 'Segoe UI', Ubuntu, sans-serif; fill: #5b7694; letter-spacing: 2.6px; }
.lbl   { font: 500 12px 'Segoe UI', Ubuntu, sans-serif; fill: #5b7694; letter-spacing: .8px; }
