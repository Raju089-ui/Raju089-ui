<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img">
<title>Delivery pipeline</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f2038"/></linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#29a8ff"/><stop offset="100%" stop-color="#00d4e0" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%"><stop offset="0%" stop-color="#29a8ff" stop-opacity="0.22"/><stop offset="100%" stop-color="#29a8ff" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>

</defs>
<style>
.h1    { font: 700 38px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6f0fa; }
.h2    { font: 700 27px 'Segoe UI', Ubuntu, sans-serif; fill: #e6f0fa; }
.sub   { font: 400 16px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; }
.sec   { font: 600 13px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; letter-spacing: 2.6px; }
.lbl   { font: 500 12px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; letter-spacing: .8px; }
.lblb  { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; fill: #e6f0fa; letter-spacing: .4px; }
.body  { font: 400 13px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; }
.stat  { font: 700 26px 'Segoe UI', Ubuntu, sans-serif; fill: #e6f0fa; }
.slabv { font: 700 15px 'Segoe UI', Ubuntu, sans-serif; fill: #ffffff; }
.slabl { font: 500 12px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; letter-spacing: .6px; }
.chip  { font: 500 11px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: .4px; }
.foot  { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #5d7a9b; }
.tile  { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: .3px; }
.rise  { animation: rise 1s cubic-bezier(.2,.8,.3,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(20px) }
                  to   { opacity: 1; transform: translateY(0) } }
</style>
<rect width="1000" height="430" rx="18" fill="url(#bg)"/>
<g class="rise"><text x="54" y="56" class="sec">DELIVERY PIPELINE</text><rect x="54" y="66" width="320" height="2" rx="1" fill="url(#rule)"/><text x="54" y="88" class="body">Every commit walks this path before anything reaches a cluster.</text><polygon points="85,291.5 223.333,291.5 361.667,291.5 500,291.5 638.333,291.5 776.667,291.5 915,291.5 915,244.5 776.667,244.5 638.333,244.5 500,244.5 361.667,244.5 223.333,244.5 85,244.5" fill="#12233c" opacity="0.65"/><line x1="117.76" y1="254" x2="190.573" y2="254" stroke="#29a8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" stroke-dasharray="1 7"/><line x1="256.093" y1="254" x2="328.907" y2="254" stroke="#29a8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" stroke-dasharray="1 7"/><line x1="394.427" y1="254" x2="467.24" y2="254" stroke="#29a8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" stroke-dasharray="1 7"/><line x1="532.76" y1="254" x2="605.573" y2="254" stroke="#29a8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" stroke-dasharray="1 7"/><line x1="671.093" y1="254" x2="743.907" y2="254" stroke="#29a8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" stroke-dasharray="1 7"/><line x1="809.427" y1="254" x2="882.24" y2="254" stroke="#29a8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" stroke-dasharray="1 7"/><ellipse cx="85" cy="271.9" rx="40.56" ry="19.5" fill="#030911" opacity="0.55" filter="url(#soft)"/><polygon points="46,222 85,241.5 85,287.5 46,268" fill="#7e3613"/><polygon points="124,222 85,241.5 85,287.5 124,268" fill="#b54e1b"/><polygon points="85,202.5 124,222 85,241.5 46,222" fill="#FC6D26"/><text x="85" y="226" text-anchor="middle" class="tile" fill="#ffffff">1</text><text x="85" y="317.5" text-anchor="middle" class="lblb">Code</text><text x="85" y="337.5" text-anchor="middle" class="lbl">GitLab</text><ellipse cx="223.333" cy="271.9" rx="40.56" ry="19.5" fill="#030911" opacity="0.55" filter="url(#soft)"/><polygon points="184.333,206 223.333,225.5 223.333,287.5 184.333,268" fill="#691c19"/><polygon points="262.333,206 223.333,225.5 223.333,287.5 262.333,268" fill="#972824"/><polygon points="223.333,186.5 262.333,206 223.333,225.5 184.333,206" fill="#D33833"/><text x="223.333" y="210" text-anchor="middle" class="tile" fill="#ffffff">2</text><text x="223.333" y="317.5" text-anchor="middle" class="lblb">Build</text><text x="223.333" y="337.5" text-anchor="middle" class="lbl">Jenkins</text><ellipse cx="361.667" cy="271.9" rx="40.56" ry="19.5" fill="#030911" opacity="0.55" filter="url(#soft)"/><polygon points="322.667,222 361.667,241.5 361.667,287.5 322.667,268" fill="#274d66"/><polygon points="400.667,222 361.667,241.5 361.667,287.5 400.667,268" fill="#386f93"/><polygon points="361.667,202.5 400.667,222 361.667,241.5 322.667,222" fill="#4E9BCD"/><text x="361.667" y="226" text-anchor="middle" class="tile" fill="#ffffff">3</text><text x="361.667" y="317.5" text-anchor="middle" class="lblb">Scan</text><text x="361.667" y="337.5" text-anchor="middle" class="lbl">SonarQube</text><text x="361.667" y="353.5" text-anchor="middle" class="lbl">Trivy</text><ellipse cx="500" cy="271.9" rx="40.56" ry="19.5" fill="#030911" opacity="0.55" filter="url(#soft)"/><polygon points="461,206 500,225.5 500,287.5 461,268" fill="#3d215e"/><polygon points="539,206 500,225.5 500,287.5 539,268" fill="#582f87"/><polygon points="500,186.5 539,206 500,225.5 461,206" fill="#7B42BC"/><text x="500" y="210" text-anchor="middle" class="tile" fill="#ffffff">4</text><text x="500" y="317.5" text-anchor="middle" class="lblb">Sign</text><text x="500" y="337.5" text-anchor="middle" class="lbl">Cosign</text><ellipse cx="638.333" cy="271.9" rx="40.56" ry="19.5" fill="#030911" opacity="0.55" filter="url(#soft)"/><polygon points="599.333,222 638.333,241.5 638.333,287.5 599.333,268" fill="#003c6a"/><polygon points="677.333,222 638.333,241.5 638.333,287.5 677.333,268" fill="#005698"/><polygon points="638.333,202.5 677.333,222 638.333,241.5 599.333,222" fill="#0078d4"/><text x="638.333" y="226" text-anchor="middle" class="tile" fill="#ffffff">5</text><text x="638.333" y="317.5" text-anchor="middle" class="lblb">Gate</text><text x="638.333" y="337.5" text-anchor="middle" class="lbl">OPA</text><text x="638.333" y="353.5" text-anchor="middle" class="lbl">Kyverno</text><ellipse cx="776.667" cy="271.9" rx="40.56" ry="19.5" fill="#030911" opacity="0.55" filter="url(#soft)"/><polygon points="737.667,206 776.667,225.5 776.667,287.5 737.667,268" fill="#193672"/><polygon points="815.667,206 776.667,225.5 776.667,287.5 815.667,268" fill="#244da4"/><polygon points="776.667,186.5 815.667,206 776.667,225.5 737.667,206" fill="#326CE5"/><text x="776.667" y="210" text-anchor="middle" class="tile" fill="#ffffff">6</text><text x="776.667" y="317.5" text-anchor="middle" class="lblb">Deploy</text><text x="776.667" y="337.5" text-anchor="middle" class="lbl">AKS</text><text x="776.667" y="353.5" text-anchor="middle" class="lbl">Helm</text><ellipse cx="915" cy="271.9" rx="40.56" ry="19.5" fill="#030911" opacity="0.55" filter="url(#soft)"/><polygon points="876,222 915,241.5 915,287.5 876,268" fill="#7a3400"/><polygon points="954,222 915,241.5 915,287.5 954,268" fill="#af4a00"/><polygon points="915,202.5 954,222 915,241.5 876,222" fill="#F46800"/><text x="915" y="226" text-anchor="middle" class="tile" fill="#ffffff">7</text><text x="915" y="317.5" text-anchor="middle" class="lblb">Observe</text><text x="915" y="337.5" text-anchor="middle" class="lbl">Grafana</text><text x="915" y="353.5" text-anchor="middle" class="lbl">Loki</text><text x="54" y="404" class="foot">build &#8594; verify &#8594; sign &#8594; admit &#8594; watch</text></g>
</svg>