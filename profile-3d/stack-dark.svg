<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="486" viewBox="0 0 1000 486" role="img">
<title>Technology stack</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f2038"/></linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#29a8ff"/><stop offset="100%" stop-color="#00d4e0" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%"><stop offset="0%" stop-color="#29a8ff" stop-opacity="0.22"/><stop offset="100%" stop-color="#29a8ff" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>

</defs>
<style>
.h1    { font: 700 38px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6f0fa; }
.h2    { font: 700 27px 'Segoe UI', Ubuntu, sans-serif; fill: #e6f0fa; }
.sub   { font: 400 16px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; }
.sec   { font: 600 13px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; letter-spacing: 2.6px; }
.lbl   { font: 500 12px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; letter-spacing: .8px; }
.lblb  { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; fill: #e6f0fa; letter-spacing: .4px; }
.body  { font: 400 13px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; }
.stat  { font: 700 26px 'Segoe UI', Ubuntu, sans-serif; fill: #e6f0fa; }
.slabv { font: 700 15px 'Segoe UI', Ubuntu, sans-serif; fill: #ffffff; }
.slabl { font: 500 12px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; letter-spacing: .6px; }
.chip  { font: 500 11px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: .4px; }
.foot  { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #5d7a9b; }
.tile  { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: .3px; }

/* The panel must be fully visible with no animation at all: anything that
   starts at opacity 0 renders blank wherever animations are blocked
   (reduced-motion, sanitisers, static rasterisers). So the entrance is an
   enhancement layered on top of a visible default, never a prerequisite. */
.rise  { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise 1s cubic-bezier(.2,.8,.3,1) 1 normal none running; }
}
@keyframes rise { from { opacity: 0; transform: translateY(20px) }
                  to   { opacity: 1; transform: translateY(0) } }
</style>
<rect width="1000" height="486" rx="18" fill="url(#bg)"/>
