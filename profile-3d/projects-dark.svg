<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img">
<title>Featured engineering work</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1628"/><stop offset="100%" stop-color="#0f2038"/></linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#29a8ff"/><stop offset="100%" stop-color="#00d4e0" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%"><stop offset="0%" stop-color="#29a8ff" stop-opacity="0.22"/><stop offset="100%" stop-color="#29a8ff" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>

</defs>
<style>
.h1    { font: 700 38px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #e6f0fa; }
.h2    { font: 700 27px 'Segoe UI', Ubuntu, sans-serif; fill: #e6f0fa; }
.sub   { font: 400 16px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; }
.sec   { font: 600 13px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; letter-spacing: 2.6px; }
.lbl   { font: 500 12px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; letter-spacing: .8px; }
.lblb  { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; fill: #e6f0fa; letter-spacing: .4px; }
.body  { font: 400 13px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; }
.stat  { font: 700 26px 'Segoe UI', Ubuntu, sans-serif; fill: #e6f0fa; }
.slabv { font: 700 15px 'Segoe UI', Ubuntu, sans-serif; fill: #ffffff; }
.slabl { font: 500 12px 'Segoe UI', Ubuntu, sans-serif; fill: #7f9bbb; letter-spacing: .6px; }
.chip  { font: 500 11px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: .4px; }
.foot  { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #5d7a9b; }
.tile  { font: 700 13px 'Segoe UI', Ubuntu, sans-serif; letter-spacing: .3px; }
.rise  { animation: rise 1s cubic-bezier(.2,.8,.3,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(20px) }
                  to   { opacity: 1; transform: translateY(0) } }
</style>
<rect width="1000" height="470" rx="18" fill="url(#bg)"/>
<g class="rise"><text x="54" y="56" class="sec">FEATURED ENGINEERING WORK</text><rect x="54" y="66" width="320" height="2" rx="1" fill="url(#rule)"/><ellipse cx="198" cy="203.5" rx="78" ry="37.5" fill="#030911" opacity="0.55" filter="url(#soft)"/><polygon points="123,162 198,199.5 198,233.5 123,196" fill="#3d215e"/><polygon points="273,162 198,199.5 198,233.5 273,196" fill="#582f87"/><polygon points="198,124.5 273,162 198,199.5 123,162" fill="#7B42BC"/><text x="198" y="168" text-anchor="middle" class="tile" fill="#ffffff">01</text><rect x="54" y="252" width="288" height="196" rx="14" fill="#10203a" stroke="#1d3350" stroke-width="1"/><rect x="70" y="252" width="256" height="3" rx="2" fill="#7B42BC"/><text x="74" y="288" class="lblb" style="font-size:15px">Terraform AKS</text><text x="74" y="308" class="lblb" style="font-size:15px">Infrastructure</text><text x="74" y="338" class="body">Reusable modules for enterprise</text><text x="74" y="356" class="body">Azure: networking, NSGs, AKS, ACR,</text><text x="74" y="374" class="body">Key Vault, Log Analytics, App</text><text x="74" y="392" class="body">Gateway.</text><g><rect x="74" y="412" width="79.42" height="22" rx="11" fill="#1d244a" stroke="#1d3350" stroke-width="1"/><text x="113.71" y="427" text-anchor="middle" class="chip" fill="#7B42BC">Terraform</text></g><g><rect x="159.42" y="412" width="41.14" height="22" rx="11" fill="#1d244a" stroke="#1d3350" stroke-width="1"/><text x="179.99" y="427" text-anchor="middle" class="chip" fill="#7B42BC">AKS</text></g><g><rect x="206.56" y="412" width="79.42" height="22" rx="11" fill="#1d244a" stroke="#1d3350" stroke-width="1"/><text x="246.27" y="427" text-anchor="middle" class="chip" fill="#7B42BC">Key Vault</text></g><ellipse cx="506" cy="203.5" rx="78" ry="37.5" fill="#030911" opacity="0.55" filter="url(#soft)"/><polygon points="431,162 506,199.5 506,233.5 431,196" fill="#193672"/><polygon points="581,162 506,199.5 506,233.5 581,196" fill="#244da4"/><polygon points="506,124.5 581,162 506,199.5 431,162" fill="#326CE5"/><text x="506" y="168" text-anchor="middle" class="tile" fill="#ffffff">02</text><rect x="362" y="252" width="288" height="196" rx="14" fill="#10203a" stroke="#1d3350" stroke-width="1"/><rect x="378" y="252" width="256" height="3" rx="2" fill="#326CE5"/><text x="382" y="288" class="lblb" style="font-size:15px">K8s Supply Chain Lab</text><text x="382" y="318" class="body">Signed images, admission policy and</text><text x="382" y="336" class="body">runtime rules, wired end to end so a</text><text x="382" y="354" class="body">bad artifact never reaches a node.</text><g><rect x="382" y="412" width="60.28" height="22" rx="11" fill="#14294f" stroke="#1d3350" stroke-width="1"/><text x="412.14" y="427" text-anchor="middle" class="chip" fill="#326CE5">Cosign</text></g><g><rect x="448.28" y="412" width="66.66" height="22" rx="11" fill="#14294f" stroke="#1d3350" stroke-width="1"/><text x="481.61" y="427" text-anchor="middle" class="chip" fill="#326CE5">Kyverno</text></g><g><rect x="520.94" y="412" width="53.9" height="22" rx="11" fill="#14294f" stroke="#1d3350" stroke-width="1"/><text x="547.89" y="427" text-anchor="middle" class="chip" fill="#326CE5">Falco</text></g><ellipse cx="814" cy="203.5" rx="78" ry="37.5" fill="#030911" opacity="0.55" filter="url(#soft)"/><polygon points="739,162 814,199.5 814,233.5 739,196" fill="#003c6a"/><polygon points="889,162 814,199.5 814,233.5 889,196" fill="#005698"/><polygon points="814,124.5 889,162 814,199.5 739,162" fill="#0078d4"/><text x="814" y="168" text-anchor="middle" class="tile" fill="#ffffff">03</text><rect x="670" y="252" width="288" height="196" rx="14" fill="#10203a" stroke="#1d3350" stroke-width="1"/><rect x="686" y="252" width="256" height="3" rx="2" fill="#0078d4"/><text x="690" y="288" class="lblb" style="font-size:15px">Azure Lifecycle</text><text x="690" y="308" class="lblb" style="font-size:15px">Automation</text><text x="690" y="338" class="body">Terraform and Azure DevOps patterns</text><text x="690" y="356" class="body">that keep every environment</text><text x="690" y="374" class="body">deploying the same way.</text><g><rect x="690" y="412" width="98.56" height="22" rx="11" fill="#0e2b4c" stroke="#1d3350" stroke-width="1"/><text x="739.28" y="427" text-anchor="middle" class="chip" fill="#0078d4">Azure DevOps</text></g><g><rect x="794.56" y="412" width="53.9" height="22" rx="11" fill="#0e2b4c" stroke="#1d3350" stroke-width="1"/><text x="821.51" y="427" text-anchor="middle" class="chip" fill="#0078d4">CI/CD</text></g></g>
</svg>