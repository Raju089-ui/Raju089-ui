<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" fill="none">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#e8f1fb"/>
    </linearGradient>
    <linearGradient id="aBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
    <linearGradient id="aCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b7c3"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="aTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b294"/>
      <stop offset="100%" stop-color="#008272"/>
    </linearGradient>
    <linearGradient id="aPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8661c5"/>
      <stop offset="100%" stop-color="#5c2d91"/>
    </linearGradient>
    <linearGradient id="aOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#d83b01"/>
    </linearGradient>
    <filter id="as" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0a3d6e" flood-opacity="0.1"/>
    </filter>
    <filter id="as2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0078d4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="16" fill="url(#abg)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1a3a5c" letter-spacing="4" opacity="0.6">AKS ARCHITECTURE</text>

  <!-- ====== TIER 1: Internet ====== -->
  <g filter="url(#as)">
    <rect x="375" y="50" width="150" height="40" rx="10" fill="white" stroke="#0078d4" stroke-width="1.2"/>
    <text x="450" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1a3a5c">Internet</text>
  </g>
  <line x1="450" y1="90" x2="450" y2="110" stroke="#0078d4" stroke-width="1.5" opacity="0.5"/>
  <polygon points="446,108 450,116 454,108" fill="#0078d4" opacity="0.5"/>

  <!-- ====== TIER 2: Azure Front Door ====== -->
  <g filter="url(#as2)">
    <rect x="345" y="115" width="210" height="44" rx="12" fill="white" stroke="#0078d4" stroke-width="1.3"/>
    <rect x="345" y="115" width="210" height="44" rx="12" fill="url(#aBlue)" opacity="0.06"/>
    <text x="450" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0078d4">Azure Front Door / WAF</text>
  </g>
  <line x1="450" y1="159" x2="450" y2="180" stroke="#0078d4" stroke-width="1.5" opacity="0.5"/>
  <polygon points="446,178 450,186 454,178" fill="#0078d4" opacity="0.5"/>

  <!-- ====== TIER 3: Application Gateway ====== -->
  <g filter="url(#as)">
    <rect x="345" y="185" width="210" height="44" rx="12" fill="white"/>
    <rect x="345" y="185" width="210" height="44" rx="12" fill="url(#aCyan)" opacity="0.06"/>
    <text x="450" y="212" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1a3a5c">Application Gateway</text>
  </g>
  <line x1="450" y1="229" x2="450" y2="255" stroke="#0078d4" stroke-width="1.5" opacity="0.5"/>
  <polygon points="446,253 450,261 454,253" fill="#0078d4" opacity="0.5"/>

  <!-- ====== TIER 4: AKS Cluster (large box) ====== -->
  <g filter="url(#as2)">
    <rect x="200" y="260" width="500" height="130" rx="16" fill="white" stroke="#0078d4" stroke-width="1.8"/>
    <rect x="200" y="260" width="500" height="130" rx="16" fill="url(#aBlue)" opacity="0.03"/>
    <!-- AKS label -->
    <text x="450" y="285" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0078d4" letter-spacing="2">AKS CLUSTER</text>
    <text x="450" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#5a7a9a">Azure Kubernetes Service</text>

    <!-- Frontend Pod -->
    <rect x="225" y="312" width="130" height="60" rx="10" fill="white" stroke="#00b7c3" stroke-width="1"/>
    <rect x="225" y="312" width="130" height="60" rx="10" fill="url(#aCyan)" opacity="0.06"/>
    <text x="290" y="337" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Frontend</text>
    <text x="290" y="355" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#5a7a9a">React / Angular</text>
    <text x="290" y="367" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#8a9aaa">Pods</text>

    <!-- Backend Pod -->
    <rect x="385" y="312" width="130" height="60" rx="10" fill="white" stroke="#0078d4" stroke-width="1"/>
    <rect x="385" y="312" width="130" height="60" rx="10" fill="url(#aBlue)" opacity="0.06"/>
    <text x="450" y="337" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Backend API</text>
    <text x="450" y="355" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#5a7a9a">.NET / Node.js</text>
    <text x="450" y="367" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#8a9aaa">Pods</text>

    <!-- Services Pod -->
    <rect x="545" y="312" width="130" height="60" rx="10" fill="white" stroke="#008272" stroke-width="1"/>
    <rect x="545" y="312" width="130" height="60" rx="10" fill="url(#aTeal)" opacity="0.06"/>
    <text x="610" y="337" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Services</text>
    <text x="610" y="355" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#5a7a9a">Workers / Jobs</text>
    <text x="610" y="367" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#8a9aaa">Pods</text>
  </g>

  <!-- Connections from AKS down -->
  <line x1="290" y1="390" x2="180" y2="440" stroke="#00b7c3" stroke-width="1.2" opacity="0.5"/>
  <line x1="450" y1="390" x2="450" y2="440" stroke="#0078d4" stroke-width="1.2" opacity="0.5"/>
  <line x1="610" y1="390" x2="720" y2="440" stroke="#008272" stroke-width="1.2" opacity="0.5"/>

  <!-- ====== TIER 5: Supporting Services ====== -->
  <!-- ACR -->
  <g filter="url(#as)">
    <rect x="105" y="440" width="150" height="44" rx="10" fill="white"/>
    <rect x="105" y="440" width="150" height="44" rx="10" fill="url(#aCyan)" opacity="0.06"/>
    <text x="180" y="467" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">ACR</text>
    <text x="180" y="480" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#5a7a9a">Container Registry</text>
  </g>

  <!-- Azure Database -->
  <g filter="url(#as)">
    <rect x="375" y="440" width="150" height="44" rx="10" fill="white"/>
    <rect x="375" y="440" width="150" height="44" rx="10" fill="url(#aBlue)" opacity="0.06"/>
    <text x="450" y="467" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Azure Database</text>
    <text x="450" y="480" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#5a7a9a">SQL / Cosmos DB</text>
  </g>

  <!-- Event Hub -->
  <g filter="url(#as)">
    <rect x="645" y="440" width="150" height="44" rx="10" fill="white"/>
    <rect x="645" y="440" width="150" height="44" rx="10" fill="url(#aTeal)" opacity="0.06"/>
    <text x="720" y="467" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Event Hub</text>
    <text x="720" y="480" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#5a7a9a">Messaging</text>
  </g>

  <!-- Connections to Monitoring -->
  <line x1="180" y1="484" x2="380" y2="530" stroke="#00b7c3" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="484" x2="450" y2="530" stroke="#0078d4" stroke-width="1" opacity="0.4"/>
  <line x1="720" y1="484" x2="520" y2="530" stroke="#008272" stroke-width="1" opacity="0.3"/>

  <!-- ====== TIER 6: Azure Monitor ====== -->
  <g filter="url(#as2)">
    <rect x="330" y="530" width="240" height="44" rx="12" fill="white" stroke="#008272" stroke-width="1.3"/>
    <rect x="330" y="530" width="240" height="44" rx="12" fill="url(#aTeal)" opacity="0.06"/>
    <text x="450" y="557" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#008272">Azure Monitor + Log Analytics</text>
  </g>

  <!-- ====== SIDE: Supporting Services ====== -->
  <!-- Key Vault (left) -->
  <g filter="url(#as)" opacity="0.85">
    <rect x="30" y="280" width="120" height="40" rx="8" fill="white" stroke="#5c2d91" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="90" y="305" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#5c2d91">Key Vault</text>
  </g>
  <line x1="150" y1="300" x2="200" y2="310" stroke="#5c2d91" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- NSG (left) -->
  <g filter="url(#as)" opacity="0.85">
    <rect x="30" y="340" width="120" height="40" rx="8" fill="white" stroke="#5c2d91" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="90" y="365" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#5c2d91">NSG</text>
  </g>
  <line x1="150" y1="360" x2="200" y2="350" stroke="#5c2d91" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Private Endpoint (right) -->
  <g filter="url(#as)" opacity="0.85">
    <rect x="750" y="280" width="130" height="40" rx="8" fill="white" stroke="#5c2d91" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="815" y="305" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#5c2d91">Private Endpoint</text>
  </g>
  <line x1="750" y1="300" x2="700" y2="310" stroke="#5c2d91" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Managed Identity (right) -->
  <g filter="url(#as)" opacity="0.85">
    <rect x="750" y="340" width="130" height="40" rx="8" fill="white" stroke="#5c2d91" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="815" y="365" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#5c2d91">Managed Identity</text>
  </g>
  <line x1="750" y1="360" x2="700" y2="350" stroke="#5c2d91" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Footer label -->
  <text x="450" y="600" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#0078d4" opacity="0.4" letter-spacing="2">AZURE KUBERNETES SERVICE — PRODUCTION ARCHITECTURE</text>
</svg>
