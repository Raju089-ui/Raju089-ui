<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" fill="none">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#edf4fc"/>
    </linearGradient>
    <linearGradient id="tPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8661c5"/>
      <stop offset="100%" stop-color="#5c2d91"/>
    </linearGradient>
    <linearGradient id="tBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
    <linearGradient id="tTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b294"/>
      <stop offset="100%" stop-color="#008272"/>
    </linearGradient>
    <filter id="ts" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0a3d6e" flood-opacity="0.1"/>
    </filter>
    <filter id="ts2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#5c2d91" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" rx="16" fill="url(#tbg)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1a3a5c" letter-spacing="4" opacity="0.6">INFRASTRUCTURE AS CODE</text>

  <!-- Row 1: Terraform -->
  <g filter="url(#ts2)">
    <rect x="355" y="50" width="190" height="48" rx="12" fill="white" stroke="#5c2d91" stroke-width="1.3"/>
    <rect x="355" y="50" width="190" height="48" rx="12" fill="url(#tPurple)" opacity="0.06"/>
    <text x="400" y="79" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c2d91">⬢</text>
    <text x="460" y="79" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#5c2d91">Terraform</text>
  </g>
  <line x1="450" y1="98" x2="450" y2="120" stroke="#5c2d91" stroke-width="1.5" opacity="0.4"/>
  <polygon points="446,118 450,126 454,118" fill="#5c2d91" opacity="0.4"/>

  <!-- Row 2: Reusable Modules -->
  <g filter="url(#ts)">
    <rect x="340" y="128" width="220" height="44" rx="12" fill="white"/>
    <rect x="340" y="128" width="220" height="44" rx="12" fill="url(#tPurple)" opacity="0.04"/>
    <text x="450" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1a3a5c">Reusable Modules</text>
  </g>
  <line x1="450" y1="172" x2="450" y2="195" stroke="#5c2d91" stroke-width="1.5" opacity="0.4"/>
  <polygon points="446,193 450,201 454,193" fill="#5c2d91" opacity="0.4"/>

  <!-- Row 3: Environment Cards -->
  <g filter="url(#ts)">
    <rect x="145" y="203" width="100" height="38" rx="8" fill="white" stroke="#0078d4" stroke-width="1"/>
    <text x="195" y="227" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0078d4">Dev</text>
  </g>
  <g filter="url(#ts)">
    <rect x="275" y="203" width="100" height="38" rx="8" fill="white" stroke="#00b7c3" stroke-width="1"/>
    <text x="325" y="227" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#00b7c3">QA</text>
  </g>
  <g filter="url(#ts)">
    <rect x="405" y="203" width="100" height="38" rx="8" fill="white" stroke="#ff8c00" stroke-width="1"/>
    <text x="455" y="227" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#ff8c00">UAT</text>
  </g>
  <g filter="url(#ts)">
    <rect x="535" y="203" width="100" height="38" rx="8" fill="white" stroke="#008272" stroke-width="1"/>
    <text x="585" y="227" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#008272">Staging</text>
  </g>
  <g filter="url(#ts2)">
    <rect x="665" y="203" width="100" height="38" rx="8" fill="white" stroke="#107c10" stroke-width="1.3"/>
    <text x="715" y="227" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#107c10">Prod</text>
  </g>

  <!-- Connections down -->
  <line x1="195" y1="241" x2="195" y2="270" stroke="#0078d4" stroke-width="1" opacity="0.3"/>
  <line x1="325" y1="241" x2="325" y2="270" stroke="#00b7c3" stroke-width="1" opacity="0.3"/>
  <line x1="455" y1="241" x2="455" y2="270" stroke="#ff8c00" stroke-width="1" opacity="0.3"/>
  <line x1="585" y1="241" x2="585" y2="270" stroke="#008272" stroke-width="1" opacity="0.3"/>
  <line x1="715" y1="241" x2="715" y2="270" stroke="#107c10" stroke-width="1" opacity="0.3"/>

  <!-- Row 4: Azure Infrastructure Modules -->
  <g filter="url(#ts)">
    <rect x="100" y="270" width="710" height="80" rx="14" fill="white" stroke="#0078d4" stroke-width="1.2"/>
    <rect x="100" y="270" width="710" height="80" rx="14" fill="url(#tBlue)" opacity="0.03"/>
    <text x="455" y="293" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0078d4" letter-spacing="2">AZURE INFRASTRUCTURE</text>

    <!-- Module blocks -->
    <rect x="120" y="305" width="80" height="30" rx="6" fill="url(#tBlue)" opacity="0.08"/>
    <text x="160" y="324" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="600" fill="#1a3a5c">Resource Grp</text>

    <rect x="210" y="305" width="65" height="30" rx="6" fill="url(#tBlue)" opacity="0.08"/>
    <text x="242" y="324" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="600" fill="#1a3a5c">VNet</text>

    <rect x="285" y="305" width="60" height="30" rx="6" fill="url(#tBlue)" opacity="0.08"/>
    <text x="315" y="324" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="600" fill="#1a3a5c">NSG</text>

    <rect x="355" y="305" width="60" height="30" rx="6" fill="url(#tBlue)" opacity="0.08"/>
    <text x="385" y="324" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="600" fill="#1a3a5c">AKS</text>

    <rect x="425" y="305" width="60" height="30" rx="6" fill="url(#tBlue)" opacity="0.08"/>
    <text x="455" y="324" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="600" fill="#1a3a5c">ACR</text>

    <rect x="495" y="305" width="80" height="30" rx="6" fill="url(#tBlue)" opacity="0.08"/>
    <text x="535" y="324" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="600" fill="#1a3a5c">Key Vault</text>

    <rect x="585" y="305" width="95" height="30" rx="6" fill="url(#tBlue)" opacity="0.08"/>
    <text x="632" y="324" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="600" fill="#1a3a5c">Log Analytics</text>

    <rect x="690" y="305" width="100" height="30" rx="6" fill="url(#tBlue)" opacity="0.08"/>
    <text x="740" y="324" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="600" fill="#1a3a5c">App Gateway</text>
  </g>

  <!-- Footer -->
  <text x="450" y="370" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#5c2d91" opacity="0.4" letter-spacing="2">REUSABLE TERRAFORM MODULES — ENVIRONMENT-SPECIFIC CONFIGURATION</text>
</svg>
