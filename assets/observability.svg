<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" fill="none">
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#edf4fc"/>
    </linearGradient>
    <linearGradient id="oTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b294"/>
      <stop offset="100%" stop-color="#008272"/>
    </linearGradient>
    <linearGradient id="oBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
    <filter id="os" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0a3d6e" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="900" height="310" rx="16" fill="url(#obg)"/>

  <text x="450" y="35" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1a3a5c" letter-spacing="4" opacity="0.6">OBSERVABILITY</text>

  <!-- Horizontal flow -->
  <!-- Application -->
  <g filter="url(#os)">
    <rect x="60" y="80" width="140" height="50" rx="12" fill="white" stroke="#0078d4" stroke-width="1.2"/>
    <text x="130" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#0078d4">⟨⟩</text>
    <text x="130" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Application</text>
  </g>
  <!-- Arrow -->
  <line x1="200" y1="105" x2="240" y2="105" stroke="#0078d4" stroke-width="1.5" opacity="0.5"/>
  <polygon points="238,101 246,105 238,109" fill="#0078d4" opacity="0.5"/>

  <!-- Azure Monitor -->
  <g filter="url(#os)">
    <rect x="248" y="80" width="160" height="50" rx="12" fill="white" stroke="#008272" stroke-width="1.3"/>
    <rect x="248" y="80" width="160" height="50" rx="12" fill="url(#oTeal)" opacity="0.06"/>
    <text x="328" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#008272">◉</text>
    <text x="328" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Azure Monitor</text>
  </g>
  <line x1="408" y1="105" x2="450" y2="105" stroke="#008272" stroke-width="1.5" opacity="0.5"/>
  <polygon points="448,101 456,105 448,109" fill="#008272" opacity="0.5"/>

  <!-- Log Analytics -->
  <g filter="url(#os)">
    <rect x="458" y="80" width="160" height="50" rx="12" fill="white"/>
    <rect x="458" y="80" width="160" height="50" rx="12" fill="url(#oBlue)" opacity="0.05"/>
    <text x="538" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#0078d4">▤</text>
    <text x="538" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Log Analytics</text>
  </g>
  <line x1="618" y1="105" x2="660" y2="105" stroke="#0078d4" stroke-width="1.5" opacity="0.5"/>
  <polygon points="658,101 666,105 658,109" fill="#0078d4" opacity="0.5"/>

  <!-- App Insights -->
  <g filter="url(#os)">
    <rect x="668" y="80" width="180" height="50" rx="12" fill="white"/>
    <rect x="668" y="80" width="180" height="50" rx="12" fill="url(#oTeal)" opacity="0.05"/>
    <text x="758" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#008272">◎</text>
    <text x="758" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Application Insights</text>
  </g>

  <!-- Down from Log Analytics -->
  <line x1="538" y1="130" x2="538" y2="175" stroke="#0078d4" stroke-width="1.2" opacity="0.4"/>
  <polygon points="534,173 538,181 542,173" fill="#0078d4" opacity="0.4"/>

  <!-- Alerts / Diagnostics row -->
  <g filter="url(#os)">
    <rect x="348" y="183" width="140" height="44" rx="10" fill="white" stroke="#ff8c00" stroke-width="1"/>
    <text x="418" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#d83b01">Alerts</text>
  </g>
  <g filter="url(#os)">
    <rect x="518" y="183" width="140" height="44" rx="10" fill="white" stroke="#008272" stroke-width="1"/>
    <text x="588" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#008272">Diagnostics</text>
  </g>

  <!-- Connections -->
  <line x1="538" y1="175" x2="418" y2="183" stroke="#ff8c00" stroke-width="1" opacity="0.3"/>
  <line x1="538" y1="175" x2="588" y2="183" stroke="#008272" stroke-width="1" opacity="0.3"/>

  <!-- Down from App Insights -->
  <line x1="758" y1="130" x2="758" y2="175" stroke="#008272" stroke-width="1.2" opacity="0.4"/>
  <polygon points="754,173 758,181 762,173" fill="#008272" opacity="0.4"/>

  <g filter="url(#os)">
    <rect x="688" y="183" width="140" height="44" rx="10" fill="white"/>
    <rect x="688" y="183" width="140" height="44" rx="10" fill="url(#oTeal)" opacity="0.05"/>
    <text x="758" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Dashboards</text>
  </g>

  <!-- Description -->
  <text x="450" y="265" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5a7a9a">"Metrics, logs and traces collected across all Azure resources</text>
  <text x="450" y="282" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5a7a9a">for real-time visibility and proactive alerting."</text>
</svg>
