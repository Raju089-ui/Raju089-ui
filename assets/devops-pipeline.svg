<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#eaf3fe"/>
    </linearGradient>
    <linearGradient id="azBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b294"/>
      <stop offset="100%" stop-color="#008272"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8661c5"/>
      <stop offset="100%" stop-color="#5c2d91"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b7c3"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#d83b01"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#107c10"/>
      <stop offset="100%" stop-color="#0b5a08"/>
    </linearGradient>
    <linearGradient id="connLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00b7c3" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="nodeShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0a3d6e" flood-opacity="0.1"/>
    </filter>
    <filter id="accentShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0078d4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1a3a5c" letter-spacing="4" opacity="0.6">DEVOPS PIPELINE</text>

  <!-- Vertical connector line (main spine) -->
  <line x1="450" y1="55" x2="450" y2="660" stroke="url(#connLine)" stroke-width="2" stroke-dasharray="6,4" opacity="0.35"/>

  <!-- NODE 1: Developer -->
  <g filter="url(#accentShadow)">
    <rect x="365" y="55" width="170" height="48" rx="12" fill="white" stroke="#0078d4" stroke-width="1.5"/>
    <circle cx="395" cy="79" r="12" fill="url(#azBlue)" opacity="0.12"/>
    <text x="395" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#0078d4">⟨⟩</text>
    <text x="455" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1a3a5c">Developer</text>
  </g>
  <!-- Arrow -->
  <polygon points="445,108 450,118 455,108" fill="#0078d4" opacity="0.5"/>

  <!-- NODE 2: Git -->
  <g filter="url(#nodeShadow)">
    <rect x="375" y="120" width="150" height="48" rx="12" fill="white"/>
    <rect x="375" y="120" width="150" height="48" rx="12" fill="#0078d4" opacity="0.04"/>
    <circle cx="405" cy="144" r="12" fill="url(#azBlue)" opacity="0.12"/>
    <text x="405" y="149" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#0078d4">⎇</text>
    <text x="460" y="149" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1a3a5c">Git Commit</text>
  </g>
  <polygon points="445,173 450,183 455,173" fill="#0078d4" opacity="0.5"/>

  <!-- NODE 3: Azure DevOps -->
  <g filter="url(#nodeShadow)">
    <rect x="355" y="185" width="190" height="48" rx="12" fill="white"/>
    <rect x="355" y="185" width="190" height="48" rx="12" fill="url(#cyan)" opacity="0.06"/>
    <circle cx="385" cy="209" r="12" fill="url(#cyan)" opacity="0.12"/>
    <text x="385" y="214" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#0078d4">⟲</text>
    <text x="460" y="214" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1a3a5c">Azure DevOps CI/CD</text>
  </g>
  <polygon points="445,238 450,248 455,238" fill="#0078d4" opacity="0.5"/>

  <!-- NODE 4: SAST -->
  <g filter="url(#nodeShadow)">
    <rect x="370" y="250" width="160" height="48" rx="12" fill="white"/>
    <rect x="370" y="250" width="160" height="48" rx="12" fill="url(#purple)" opacity="0.05"/>
    <circle cx="400" cy="274" r="12" fill="url(#purple)" opacity="0.12"/>
    <text x="400" y="279" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c2d91">⛊</text>
    <text x="460" y="279" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1a3a5c">SAST Scan</text>
  </g>
  <polygon points="445,303 450,313 455,303" fill="#5c2d91" opacity="0.4"/>

  <!-- NODE 5: IaC Security -->
  <g filter="url(#nodeShadow)">
    <rect x="355" y="315" width="190" height="48" rx="12" fill="white"/>
    <rect x="355" y="315" width="190" height="48" rx="12" fill="url(#purple)" opacity="0.05"/>
    <circle cx="385" cy="339" r="12" fill="url(#purple)" opacity="0.12"/>
    <text x="385" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c2d91">🔍</text>
    <text x="462" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">IaC Security Scan</text>
  </g>
  <polygon points="445,368 450,378 455,368" fill="#5c2d91" opacity="0.4"/>

  <!-- NODE 6: Terraform Validate + Plan -->
  <g filter="url(#nodeShadow)">
    <rect x="340" y="380" width="220" height="48" rx="12" fill="white"/>
    <rect x="340" y="380" width="220" height="48" rx="12" fill="url(#purple)" opacity="0.04"/>
    <circle cx="370" cy="404" r="12" fill="url(#purple)" opacity="0.12"/>
    <text x="370" y="409" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c2d91">⬢</text>
    <text x="462" y="409" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Terraform Validate + Plan</text>
  </g>
  <polygon points="445,433 450,443 455,433" fill="#5c2d91" opacity="0.4"/>

  <!-- NODE 7: Manual Approval -->
  <g filter="url(#accentShadow)">
    <rect x="358" y="445" width="184" height="48" rx="12" fill="white" stroke="#ff8c00" stroke-width="1.2" stroke-dasharray="4,3"/>
    <circle cx="388" cy="469" r="12" fill="url(#orange)" opacity="0.12"/>
    <text x="388" y="474" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#d83b01">⏸</text>
    <text x="460" y="474" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Manual Approval</text>
  </g>
  <polygon points="445,498 450,508 455,498" fill="#ff8c00" opacity="0.5"/>

  <!-- NODE 8: Terraform Apply -->
  <g filter="url(#nodeShadow)">
    <rect x="355" y="510" width="190" height="48" rx="12" fill="white"/>
    <rect x="355" y="510" width="190" height="48" rx="12" fill="url(#teal)" opacity="0.06"/>
    <circle cx="385" cy="534" r="12" fill="url(#teal)" opacity="0.15"/>
    <text x="385" y="539" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#008272">⬢</text>
    <text x="462" y="539" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1a3a5c">Terraform Apply</text>
  </g>
  <polygon points="445,563 450,573 455,563" fill="#008272" opacity="0.5"/>

  <!-- NODE 9: Azure -->
  <g filter="url(#accentShadow)">
    <rect x="375" y="575" width="150" height="48" rx="12" fill="white" stroke="#0078d4" stroke-width="1.5"/>
    <rect x="375" y="575" width="150" height="48" rx="12" fill="url(#azBlue)" opacity="0.06"/>
    <circle cx="405" cy="599" r="12" fill="url(#azBlue)" opacity="0.15"/>
    <text x="405" y="604" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#0078d4">☁</text>
    <text x="460" y="604" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0078d4">Azure Cloud</text>
  </g>
  <polygon points="445,628 450,638 455,628" fill="#0078d4" opacity="0.5"/>

  <!-- NODE 10: AKS / Applications -->
  <g filter="url(#accentShadow)">
    <rect x="340" y="640" width="220" height="48" rx="12" fill="white" stroke="#0078d4" stroke-width="1.2"/>
    <rect x="340" y="640" width="220" height="48" rx="12" fill="url(#green)" opacity="0.05"/>
    <circle cx="370" cy="664" r="12" fill="url(#green)" opacity="0.15"/>
    <text x="370" y="669" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#107c10">⎈</text>
    <text x="462" y="669" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1a3a5c">AKS / Applications</text>
  </g>

  <!-- Side labels -->
  <!-- Left: Security Zone -->
  <rect x="60" y="245" width="180" height="168" rx="14" fill="white" opacity="0.5" stroke="#5c2d91" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="150" y="268" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#5c2d91" letter-spacing="2" opacity="0.7">SECURITY ZONE</text>
  <text x="150" y="295" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#4a4a6a">Checkov</text>
  <text x="150" y="315" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#4a4a6a">TFLint</text>
  <text x="150" y="335" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#4a4a6a">tfsec</text>
  <text x="150" y="355" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#4a4a6a">TruffleHog</text>
  <text x="150" y="375" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#4a4a6a">Azure Policy</text>
  <text x="150" y="395" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#4a4a6a">RBAC</text>
  <!-- Connector -->
  <line x1="240" y1="330" x2="355" y2="330" stroke="#5c2d91" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Right: Infra Zone -->
  <rect x="660" y="500" width="180" height="148" rx="14" fill="white" opacity="0.5" stroke="#008272" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="750" y="523" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#008272" letter-spacing="2" opacity="0.7">INFRA TARGETS</text>
  <text x="750" y="550" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#3a5a4a">VNet / NSG</text>
  <text x="750" y="570" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#3a5a4a">AKS Cluster</text>
  <text x="750" y="590" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#3a5a4a">ACR</text>
  <text x="750" y="610" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#3a5a4a">Key Vault</text>
  <text x="750" y="630" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#3a5a4a">App Gateway</text>
  <!-- Connector -->
  <line x1="545" y1="599" x2="660" y2="580" stroke="#008272" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Floating accents -->
  <circle cx="80" cy="120" r="25" fill="#0078d4" opacity="0.03"/>
  <circle cx="820" cy="160" r="30" fill="#00b7c3" opacity="0.03"/>
  <circle cx="820" cy="420" r="20" fill="#5c2d91" opacity="0.03"/>
</svg>
