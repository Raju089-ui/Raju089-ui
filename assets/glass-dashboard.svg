      <rect x="0" y="0" width="320" height="340" rx="16" fill="none" stroke="#0078d4" stroke-width="2" filter="url(#glow-blue)" opacity="0.8"/>
      <!-- Glass fill -->
      <rect x="0" y="0" width="320" height="340" rx="16" fill="url(#glass-gradient)" />
      <!-- Inner crisp border -->
      <rect x="0" y="0" width="320" height="340" rx="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
